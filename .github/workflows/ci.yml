# shellcheck and shfmt over the shell scripts, and a workflow lint. The scripts are never run.
# The jobs live in ChiefGyk3D/git-your-ship-together; this file only says what
# is specific to browser_cleanup_tools.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@9d6825dd4e0e4d524fca3733f416437bbd7851e1 # v1.31.0
    permissions:
      contents: read
    with:
      egress-policy: block
